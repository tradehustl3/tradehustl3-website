name: Wire upload extraction coverage gate

on:
  push:
    branches:
      - fix/upload-extraction-coverage-gate
    paths:
      - .github/workflows/wire-upload-coverage-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/upload-extraction-coverage-gate
      - name: Patch production checkpoints
        run: python scripts/wire-upload-coverage-gate.py
      - name: Commit patched worker
        run: |
          if git diff --quiet; then
            echo "Coverage checkpoints already wired."
            exit 0
          fi
          git config user.name "TRADE HUSTL3"
          git config user.email "tradehustl3@gmail.com"
          git add worker/resume-builder.ts
          git commit -m "Enforce upload extraction coverage before generation"
          git push origin HEAD:fix/upload-extraction-coverage-gate
