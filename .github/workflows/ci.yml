name: CI

# Runs the production build and the full test suite (tests/*.test.mjs,
# tests/*.test.ts) on every PR into main and on every push to main.
#
# `npm run lint` is deliberately NOT wired in yet: it currently fails on a
# pre-existing error in app/book/order-confirmed/order-confirmation-copy.tsx
# (react-hooks/set-state-in-effect). Add `- run: npm run lint` below once
# that is resolved so lint regressions are caught too.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test
