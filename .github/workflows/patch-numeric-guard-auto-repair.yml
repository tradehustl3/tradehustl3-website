name: Patch numeric guard auto repair

on:
  push:
    branches:
      - fix/numeric-guard-auto-repair
    paths:
      - .github/workflows/patch-numeric-guard-auto-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/numeric-guard-auto-repair
      - name: Apply numeric guard patch
        run: python scripts/patch-numeric-guard-auto-repair.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "TRADE HUSTL3"
          git config user.email "tradehustl3@gmail.com"
          git add worker/resume-builder-base.ts worker/resume-builder.ts
          git commit -m "Accept source-grounded numeric repair before retry"
          git pull --rebase origin fix/numeric-guard-auto-repair
          git push origin HEAD:fix/numeric-guard-auto-repair
