name: Patch upload verify enhance UX

on:
  push:
    branches:
      - fix/upload-verify-enhance-ux
    paths:
      - .github/workflows/patch-upload-verify-enhance-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/upload-verify-enhance-ux
      - name: Apply upload UX patch
        run: python scripts/patch-upload-verify-enhance-ux.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "TRADE HUSTL3"
          git config user.email "tradehustl3@gmail.com"
          git add app/resume-builder/intake/wizard.tsx
          git commit -m "Make upload path verify then enhance"
          git pull --rebase origin fix/upload-verify-enhance-ux
          git push origin HEAD:fix/upload-verify-enhance-ux
