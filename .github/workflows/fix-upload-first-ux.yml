name: Fix upload-first resume UX

on:
  push:
    branches:
      - fix/upload-first-ux
    paths:
      - .github/workflows/fix-upload-first-ux.yml
      - scripts/fix-upload-first-ux.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/upload-first-ux
      - name: Patch upload-first UX
        run: python scripts/fix-upload-first-ux.py
      - name: Commit UI fix
        run: |
          if git diff --quiet; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "TRADE HUSTL3"
          git config user.email "tradehustl3@gmail.com"
          git add app/resume-builder/intake/wizard.tsx
          git commit -m "Make uploaded resumes skip scratch intake flow"
          git push origin HEAD:fix/upload-first-ux
