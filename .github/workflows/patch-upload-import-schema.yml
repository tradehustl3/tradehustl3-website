name: Patch upload import schema

on:
  push:
    branches: [fix/upload-source-preservation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/upload-source-preservation
      - name: Expand Gemini import role schema
        shell: bash
        run: >-
          python3 -c 'from pathlib import Path; p=Path("worker/resume-builder-base.ts"); s=p.read_text();
          old="        required: [\"jobTitle\", \"responsibilities\"],";
          new="        required: [\n          \"employer\", \"jobTitle\", \"location\", \"employmentType\", \"startDate\", \"endDate\", \"current\",\n          \"responsibilities\", \"equipment\", \"systems\", \"workPerformed\", \"leadership\", \"workOrders\", \"measurable\",\n        ],";
          assert old in s, "required role schema marker missing"; s=s.replace(old,new,1);
          old="          location: { type: \"STRING\" },\n          startDate: { type: \"STRING\" },";
          new="          location: { type: \"STRING\" },\n          employmentType: { type: \"STRING\" },\n          startDate: { type: \"STRING\" },";
          assert old in s, "location role schema marker missing"; s=s.replace(old,new,1);
          old="          responsibilities: { type: \"STRING\" },\n        },\n      },";
          new="          responsibilities: { type: \"STRING\" },\n          equipment: { type: \"STRING\" },\n          systems: { type: \"STRING\" },\n          workPerformed: { type: \"STRING\" },\n          leadership: { type: \"STRING\" },\n          workOrders: { type: \"STRING\" },\n          measurable: { type: \"STRING\" },\n        },\n      },";
          assert old in s, "responsibility role schema marker missing"; s=s.replace(old,new,1); p.write_text(s)'
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "TRADE HUSTL3 Automation"
          git config user.email "tradehustl3@gmail.com"
          git add worker/resume-builder-base.ts
          git rm .github/workflows/patch-upload-import-schema.yml
          git commit -m "Capture full uploaded job structure in Gemini import schema"
          git push origin HEAD:fix/upload-source-preservation
