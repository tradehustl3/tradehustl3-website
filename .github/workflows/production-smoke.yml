name: Production Smoke

permissions:
  contents: read

on:
  check_run:
    types: [completed]

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event.check_run.name == 'Workers Builds: tradehustl3-website' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.check_suite.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUSTOM_ORIGIN: https://tradehustl3.com
    steps:
      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header 'Accept: text/html,application/xhtml+xml' \
            --header 'User-Agent: Mozilla/5.0 (compatible; TRADE-HUSTL3-Production-Smoke/1.0)' \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$CUSTOM_ORIGIN/" \
            --output /dev/null

      - name: Verify production Resume Builder entry point
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header 'Accept: text/html,application/xhtml+xml' \
            --header 'User-Agent: Mozilla/5.0 (compatible; TRADE-HUSTL3-Production-Smoke/1.0)' \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$CUSTOM_ORIGIN/resume-builder" \
            --output /dev/null

      - name: Verify current Resume Builder UI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header 'Accept: text/html,application/xhtml+xml' \
            --header 'User-Agent: Mozilla/5.0 (compatible; TRADE-HUSTL3-Production-Smoke/1.0)' \
            --header 'Cache-Control: no-cache' \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "$CUSTOM_ORIGIN/" \
            --output /tmp/custom-home.html
          grep -Fq 'Continue with email' /tmp/custom-home.html
          if grep -Fq 'Create account &amp; continue' /tmp/custom-home.html; then
            echo 'Custom domain is serving the old Resume Builder account screen.'
            exit 1
          fi

          curl --fail --silent --show-error --location \
            --header 'Accept: text/html,application/xhtml+xml' \
            --header 'User-Agent: Mozilla/5.0 (compatible; TRADE-HUSTL3-Production-Smoke/1.0)' \
            --header 'Cache-Control: no-cache' \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "$CUSTOM_ORIGIN/resume-builder/intake" \
            --output /tmp/custom-intake.html
          grep -Fq 'UPLOAD IT OR START FRESH' /tmp/custom-intake.html
