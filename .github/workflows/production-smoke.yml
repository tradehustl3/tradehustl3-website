name: Production Smoke

permissions:
  contents: read

on:
  check_run:
    types: [completed]

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event.check_run.name == 'Workers Builds: tradehustl3-website' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.check_suite.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUSTOM_ORIGIN: https://tradehustl3.com
      SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}
    steps:
      - name: Prepare smoke request helper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/smoke-fetch.sh" <<'SH'
          # smoke_fetch URL OUTPUT ATTEMPTS DELAY [extra curl args...]
          # Fails unless the final response is below HTTP 400. On failure it
          # prints only safe response metadata, never the body or cookies.
          smoke_fetch() {
            local url="$1" output="$2" attempts="$3" delay="$4"
            shift 4
            local work status attempt
            work="$(mktemp -d)"
            local -a auth=()
            if [ -n "${SMOKE_BYPASS_TOKEN:-}" ]; then
              (umask 077; printf 'X-Smoke-Token: %s\n' "$SMOKE_BYPASS_TOKEN" > "$work/auth-header")
              auth=(--header "@$work/auth-header")
            fi
            for attempt in $(seq 1 "$attempts"); do
              status="$(curl --silent --show-error --location \
                --header 'Accept: text/html,application/xhtml+xml' \
                --header 'User-Agent: Mozilla/5.0 (compatible; TRADE-HUSTL3-Production-Smoke/1.0)' \
                "${auth[@]}" "$@" \
                --dump-header "$work/headers" --output "$work/body" \
                --write-out '%{http_code}' "$url")" || status="000"
              if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
                cp "$work/body" "$output"
                rm -rf "$work"
                return 0
              fi
              echo "Attempt $attempt/$attempts: $url failed with HTTP $status"
              if [ -s "$work/headers" ]; then
                # Keep only the final response's headers after redirects.
                awk 'BEGIN{IGNORECASE=1} /^HTTP\//{block=""} {block=block $0 "\n"} END{printf "%s", block}' \
                  "$work/headers" | tr -d '\r' \
                  | grep -iE '^(server|cf-ray|cf-mitigated|content-type):' \
                  | sed 's/^/  /' || true
              fi
              if grep -qiE '^cf-mitigated:[[:space:]]*challenge' "$work/headers" 2>/dev/null \
                || grep -qiE 'Just a moment\.\.\.|/cdn-cgi/challenge-platform|cf-chl-|Attention Required! \| Cloudflare' "$work/body" 2>/dev/null; then
                echo "  cloudflare-challenge-page: yes"
              else
                echo "  cloudflare-challenge-page: no"
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay"
              fi
            done
            rm -rf "$work"
            echo "::error::Production smoke request failed: $url (HTTP $status)"
            return 1
          }
          SH
          if [ -n "${SMOKE_BYPASS_TOKEN:-}" ]; then
            echo 'SMOKE_BYPASS_TOKEN is configured; sending X-Smoke-Token.'
          else
            echo 'SMOKE_BYPASS_TOKEN is not configured; no X-Smoke-Token sent.'
          fi

      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke-fetch.sh"
          smoke_fetch "$CUSTOM_ORIGIN/" /dev/null 6 3

      - name: Verify production Resume Builder entry point
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke-fetch.sh"
          smoke_fetch "$CUSTOM_ORIGIN/resume-builder" /dev/null 6 3

      - name: Verify current Resume Builder UI
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke-fetch.sh"
          smoke_fetch "$CUSTOM_ORIGIN/" /tmp/custom-home.html 9 5 \
            --header 'Cache-Control: no-cache'
          grep -Fq 'Continue with email' /tmp/custom-home.html
          if grep -Fq 'Create account &amp; continue' /tmp/custom-home.html; then
            echo 'Custom domain is serving the old Resume Builder account screen.'
            exit 1
          fi

          smoke_fetch "$CUSTOM_ORIGIN/resume-builder/intake" /tmp/custom-intake.html 9 5 \
            --header 'Cache-Control: no-cache'
          grep -Fq 'UPLOAD IT OR START FRESH' /tmp/custom-intake.html

      - name: Verify verified-review surfaces
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke-fetch.sh"
          smoke_fetch "$CUSTOM_ORIGIN/reviews" /dev/null 6 3

          smoke_fetch "$CUSTOM_ORIGIN/api/resume-builder/reviews/public" /tmp/public-reviews.json 6 3
          node -e '
            const body = require("fs").readFileSync("/tmp/public-reviews.json", "utf8");
            const payload = JSON.parse(body);
            if (!Array.isArray(payload.reviews)) throw new Error("Public review API did not return a reviews array.");
            for (const field of ["\"email\"", "\"user_id\"", "\"order_id\"", "\"token_hash\""]) {
              if (body.includes(field)) throw new Error(`Public review API exposed ${field}.`);
            }
            console.log(`Public review API returned ${payload.reviews.length} approved review(s).`);
          '

          # The moderation shell may render for anyone; its data is protected by
          # the authenticated API. It must never be indexed or archived.
          smoke_fetch "$CUSTOM_ORIGIN/admin/reviews" /tmp/admin-reviews.html 6 3
          robots="$(grep -oiE '<meta[^>]+name="robots"[^>]*>' /tmp/admin-reviews.html || true)"
          for directive in noindex nofollow noarchive; do
            if ! grep -qi "$directive" <<<"$robots"; then
              echo "::error::/admin/reviews robots metadata is missing $directive"
              exit 1
            fi
          done

          # Logged out, the moderation API must refuse to return review data.
          admin_auth=()
          if [ -n "${SMOKE_BYPASS_TOKEN:-}" ]; then
            (umask 077; printf 'X-Smoke-Token: %s\n' "$SMOKE_BYPASS_TOKEN" > "$RUNNER_TEMP/admin-auth-header")
            admin_auth=(--header "@$RUNNER_TEMP/admin-auth-header")
          fi
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'User-Agent: Mozilla/5.0 (compatible; TRADE-HUSTL3-Production-Smoke/1.0)' \
            "${admin_auth[@]}" "$CUSTOM_ORIGIN/api/resume-builder/reviews/admin")" || status="000"
          if [ "$status" != "401" ]; then
            echo "::error::Logged-out review admin API returned HTTP $status instead of 401"
            exit 1
          fi
