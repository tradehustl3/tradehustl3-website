name: Production Smoke

permissions:
  contents: read

# Production smoke is one stage of the main pipeline, not a separate listener.
# The Test workflow calls it after the test job passes on a push to main, with
# the pushed commit. It then waits for Cloudflare Workers Builds to finish
# deploying that same commit before checking the live site, so every commit on
# main shows one line: tests, then smoke, on one SHA.
#
# The old `check_run` trigger woke this workflow on every check event in the
# repository and skipped all but the Cloudflare one, which filled the Actions
# page with "Skipped" runs. Reusable-workflow calls fire only when called.
on:
  workflow_call:
    inputs:
      sha:
        description: Commit on main that Cloudflare is deploying.
        required: true
        type: string
    secrets:
      SMOKE_BYPASS_TOKEN:
        required: false
      SMOKE_TEST_LOGIN_SECRET:
        required: false
  # Manual re-run from the Actions tab. Leave sha empty to check the current main head.
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on main (blank = current main head).
        required: false
        type: string

jobs:
  deploy:
    name: Wait for Cloudflare deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
    outputs:
      ready: ${{ steps.current.outputs.ready }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve the commit to verify
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA:-}"
          if [ -z "$sha" ]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Production smoke needs a full 40-character commit SHA."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Verifying production deploy of ${sha:0:7}."

      - name: Wait for Workers Builds to deploy this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          # Same identity the old check_run filter used: name, app and a success conclusion.
          check_name='Workers Builds: tradehustl3-website'
          deadline=$(( $(date +%s) + 20 * 60 ))
          while :; do
            state="$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits/$SMOKE_SHA/check-runs" \
              -f check_name="$check_name" -f filter=latest \
              --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages")]
                    | sort_by(.started_at) | last
                    | if . == null then "missing" else "\(.status) \(.conclusion // "none")" end')"
            case "$state" in
              "completed success")
                echo "Cloudflare deployed ${SMOKE_SHA:0:7}."
                break
                ;;
              completed\ *)
                echo "::error title=Cloudflare deploy failed::Workers Builds finished ${SMOKE_SHA:0:7} as '${state#completed }'. Check the Cloudflare build log; smoke cannot run until this commit deploys."
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=Cloudflare deploy not finished::Workers Builds had not finished ${SMOKE_SHA:0:7} after 20 minutes (last state: $state). Check the Cloudflare dashboard."
              exit 1
            fi
            echo "Workers Builds for ${SMOKE_SHA:0:7}: $state. Checking again in 20 seconds."
            sleep 20
          done

      - name: Skip if a newer main commit is already deploying
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          # The live site serves whatever main deployed last. Checking an older
          # commit against newer code produces false failures, and the newer
          # commit's own pipeline smokes the site anyway.
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" != "$SMOKE_SHA" ]; then
            echo "::notice title=Smoke handed to newer commit::main moved to ${head:0:7}; that commit's pipeline runs production smoke."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: Smoke live site
    needs: deploy
    if: needs.deploy.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One smoke at a time against production; a running smoke is never cancelled.
    concurrency:
      group: production-smoke
      cancel-in-progress: false
    env:
      CUSTOM_ORIGIN: https://tradehustl3.com
      SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}
    steps:
      - name: Prepare smoke request helper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/smoke-fetch.sh" <<'SH'
          # smoke_fetch URL OUTPUT ATTEMPTS DELAY [extra curl args...]
          # Fails unless the final response is below HTTP 400. On failure it
          # prints only safe response metadata, never the body or cookies.
          smoke_fetch() {
            local url="$1" output="$2" attempts="$3" delay="$4"
            shift 4
            local work status attempt
            work="$(mktemp -d)"
            local -a auth=()
            if [ -n "${SMOKE_BYPASS_TOKEN:-}" ]; then
              (umask 077; printf 'X-Smoke-Token: %s\n' "$SMOKE_BYPASS_TOKEN" > "$work/auth-header")
              auth=(--header "@$work/auth-header")
            fi
            for attempt in $(seq 1 "$attempts"); do
              status="$(curl --silent --show-error --location \
                --header 'Accept: text/html,application/xhtml+xml' \
                --header 'User-Agent: Mozilla/5.0 (compatible; TRADE-HUSTL3-Production-Smoke/1.0)' \
                "${auth[@]}" "$@" \
                --dump-header "$work/headers" --output "$work/body" \
                --write-out '%{http_code}' "$url")" || status="000"
              if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
                cp "$work/body" "$output"
                rm -rf "$work"
                return 0
              fi
              echo "Attempt $attempt/$attempts: $url failed with HTTP $status"
              if [ -s "$work/headers" ]; then
                # Keep only the final response's headers after redirects.
                awk 'BEGIN{IGNORECASE=1} /^HTTP\//{block=""} {block=block $0 "\n"} END{printf "%s", block}' \
                  "$work/headers" | tr -d '\r' \
                  | grep -iE '^(server|cf-ray|cf-mitigated|content-type):' \
                  | sed 's/^/  /' || true
              fi
              if grep -qiE '^cf-mitigated:[[:space:]]*challenge' "$work/headers" 2>/dev/null \
                || grep -qiE 'Just a moment\.\.\.|/cdn-cgi/challenge-platform|cf-chl-|Attention Required! \| Cloudflare' "$work/body" 2>/dev/null; then
                echo "  cloudflare-challenge-page: yes"
                # Cloudflare Bot Fight Mode (free plan) challenges GitHub runners at the
                # edge and cannot be skipped by a WAF rule. The site was never reached,
                # so this run proves nothing either way. Never report it as a pass, and
                # never report it as an outage: stop retrying and point to the manual
                # verification. See docs/production-verification.md.
                rm -rf "$work"
                touch "$RUNNER_TEMP/cloudflare-challenged"
                echo "::error title=Smoke inconclusive - Cloudflare challenge::Cloudflare Bot Fight Mode challenged the GitHub runner before it reached the site ($url). This is NOT evidence the site is down or up. Run the manual production verification in docs/production-verification.md."
                if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                  {
                    echo "## Production smoke inconclusive: Cloudflare challenge"
                    echo
                    echo "Cloudflare Bot Fight Mode challenged the GitHub runner before it reached \`$url\`."
                    echo "The deployed site was **not checked**. This is not evidence of an outage or of a healthy deploy."
                    echo
                    echo "**Next step:** run the manual production verification in \`docs/production-verification.md\`."
                  } >> "$GITHUB_STEP_SUMMARY"
                fi
                return 1
              else
                echo "  cloudflare-challenge-page: no"
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay"
              fi
            done
            rm -rf "$work"
            echo "::error::Production smoke request failed: $url (HTTP $status)"
            return 1
          }
          SH
          if [ -n "${SMOKE_BYPASS_TOKEN:-}" ]; then
            echo 'SMOKE_BYPASS_TOKEN is configured; sending X-Smoke-Token.'
          else
            echo 'SMOKE_BYPASS_TOKEN is not configured; no X-Smoke-Token sent.'
          fi

      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke-fetch.sh"
          smoke_fetch "$CUSTOM_ORIGIN/" /dev/null 6 3

      - name: Verify analytics collection is allowed by the live CSP
        shell: bash
        run: |
          set -euo pipefail
          # GA4 hits were silently blocked by connect-src from 2026-09-22 to the fix.
          # Fail the smoke run if the deployed policy ever drops a collection host.
          csp="$(curl --silent --show-error --head --location \
            --header 'User-Agent: Mozilla/5.0 (compatible; TRADE-HUSTL3-Production-Smoke/1.0)' \
            "$CUSTOM_ORIGIN/" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-security-policy:/{sub(/^[^:]*:[[:space:]]*/,""); line=$0} END{print line}')"
          connect="$(tr ';' '\n' <<<"$csp" | grep -E '^[[:space:]]*connect-src ' || true)"
          if [ -z "$connect" ]; then
            echo "::error::Live homepage has no connect-src directive."
            exit 1
          fi
          for host in 'https://analytics.google.com' 'https://\*.analytics.google.com' 'https://\*.google-analytics.com'; do
            if ! grep -qE "(^|[[:space:]])${host}([[:space:]]|$)" <<<"$connect"; then
              echo "::error::Live connect-src is missing ${host//\\/} — GA4 page views will be blocked."
              exit 1
            fi
          done
          echo 'Live CSP allows GA4 collection hosts.'

      - name: Verify production Resume Builder entry point
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke-fetch.sh"
          smoke_fetch "$CUSTOM_ORIGIN/resume-builder" /dev/null 6 3

      - name: Verify current Resume Builder UI
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke-fetch.sh"
          smoke_fetch "$CUSTOM_ORIGIN/" /tmp/custom-home.html 9 5 \
            --header 'Cache-Control: no-cache'
          grep -Fq 'Continue with email' /tmp/custom-home.html
          if grep -Fq 'Create account &amp; continue' /tmp/custom-home.html; then
            echo 'Custom domain is serving the old Resume Builder account screen.'
            exit 1
          fi

          smoke_fetch "$CUSTOM_ORIGIN/resume-builder/intake" /tmp/custom-intake.html 9 5 \
            --header 'Cache-Control: no-cache'
          # Intake heading since the 2026-09-24 design unification (see tests/rendered-html.test.mjs).
          grep -Fq 'Upload your resume once.' /tmp/custom-intake.html

      - name: Verify verified-review surfaces
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke-fetch.sh"
          smoke_fetch "$CUSTOM_ORIGIN/reviews" /dev/null 6 3

          smoke_fetch "$CUSTOM_ORIGIN/api/resume-builder/reviews/public" /tmp/public-reviews.json 6 3
          node -e '
            const body = require("fs").readFileSync("/tmp/public-reviews.json", "utf8");
            const payload = JSON.parse(body);
            if (!Array.isArray(payload.reviews)) throw new Error("Public review API did not return a reviews array.");
            for (const field of ["\"email\"", "\"user_id\"", "\"order_id\"", "\"token_hash\""]) {
              if (body.includes(field)) throw new Error(`Public review API exposed ${field}.`);
            }
            console.log(`Public review API returned ${payload.reviews.length} approved review(s).`);
          '

          # The moderation shell may render for anyone; its data is protected by
          # the authenticated API. It must never be indexed or archived.
          smoke_fetch "$CUSTOM_ORIGIN/admin/reviews" /tmp/admin-reviews.html 6 3
          robots="$(grep -oiE '<meta[^>]+name="robots"[^>]*>' /tmp/admin-reviews.html || true)"
          for directive in noindex nofollow noarchive; do
            if ! grep -qi "$directive" <<<"$robots"; then
              echo "::error::/admin/reviews robots metadata is missing $directive"
              exit 1
            fi
          done

          # Logged out, the moderation API must refuse to return review data.
          admin_auth=()
          if [ -n "${SMOKE_BYPASS_TOKEN:-}" ]; then
            (umask 077; printf 'X-Smoke-Token: %s\n' "$SMOKE_BYPASS_TOKEN" > "$RUNNER_TEMP/admin-auth-header")
            admin_auth=(--header "@$RUNNER_TEMP/admin-auth-header")
          fi
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'User-Agent: Mozilla/5.0 (compatible; TRADE-HUSTL3-Production-Smoke/1.0)' \
            "${admin_auth[@]}" "$CUSTOM_ORIGIN/api/resume-builder/reviews/admin")" || status="000"
          if [ "$status" != "401" ]; then
            echo "::error::Logged-out review admin API returned HTTP $status instead of 401"
            exit 1
          fi

      # Authenticated review-flow smoke. Signs in as the synthetic
      # smoke-test@tradehustl3.invalid account through the secret-protected
      # smoke session endpoint (no email), using two server-reset fixtures.
      - name: Check out smoke runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The exact commit Cloudflare just deployed, not whatever main is now.
          ref: ${{ needs.deploy.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Verify signed-in Resume Builder review flow
        shell: bash
        env:
          SMOKE_ORIGIN: ${{ env.CUSTOM_ORIGIN }}
          SMOKE_TEST_LOGIN_SECRET: ${{ secrets.SMOKE_TEST_LOGIN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_TEST_LOGIN_SECRET:-}" ]; then
            echo '::warning::SMOKE_TEST_LOGIN_SECRET is not configured; signed-in Resume Builder smoke skipped.'
            exit 0
          fi
          # Production dependencies only, exactly as locked (pdfjs-dist reads the preview).
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node tools/smoke/resume-builder-smoke.mjs
