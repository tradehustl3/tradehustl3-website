name: Patch authoritative uploaded resume source

on:
  push:
    branches:
      - fix/upload-authoritative-source

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/upload-authoritative-source
      - name: Patch upload source flow
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Make the raw extracted resume text actually enter wizard state.
          wizard = Path('app/resume-builder/intake/wizard.tsx')
          source = wizard.read_text()
          old = 'const nextData = mergeResumePrefill(dataRef.current, result.prefill);'
          new = 'const nextData = mergeResumePrefill(dataRef.current, result.prefill, text);'
          if old not in source:
              raise SystemExit('wizard import merge call not found')
          wizard.write_text(source.replace(old, new, 1))

          # 2) Carry raw uploaded resume text into the canonical verification record
          #    and expose line-level source facts to the generation grounding catalog.
          quality = Path('worker/resume-quality.ts')
          source = quality.read_text()

          old = '  education: string;\n  metrics: string[];\n'
          new = '  education: string;\n  sourceResumeText: string;\n  metrics: string[];\n'
          if old not in source:
              raise SystemExit('CanonicalSourceRecord field insertion point not found')
          source = source.replace(old, new, 1)

          old = '    education: text(root.education, 2_500),\n    metrics: numericClaims(metricSource),\n'
          new = '    education: text(root.education, 2_500),\n    sourceResumeText: text(root.sourceResumeText, 100_000),\n    metrics: numericClaims(metricSource),\n'
          if old not in source:
              raise SystemExit('canonical source object insertion point not found')
          source = source.replace(old, new, 1)

          old = '  mark("education", source.education);\n  return { ...source, factProvenance };\n'
          new = '  mark("education", source.education);\n  mark("sourceResumeText", source.sourceResumeText);\n  return { ...source, factProvenance };\n'
          if old not in source:
              raise SystemExit('source provenance insertion point not found')
          source = source.replace(old, new, 1)

          old = '  add("education", source.education);\n  add("customerCorrection", text(correctionRequest, 2_000));\n'
          new = '''  add("education", source.education);\n  if (source.sourceResumeText) {\n    splitClaims(source.sourceResumeText).slice(0, 160).forEach((value, index) => {\n      add(`upload.raw.${index}`, value);\n    });\n  }\n  add("customerCorrection", text(correctionRequest, 2_000));\n'''
          if old not in source:
              raise SystemExit('source fact catalog insertion point not found')
          source = source.replace(old, new, 1)

          old = '  return [...source.certifications, ...source.licenses, ...source.safety]\n'
          new = '  return [...source.certifications, ...source.licenses, ...source.safety, source.sourceResumeText]\n'
          if old not in source:
              raise SystemExit('credential support list not found')
          source = source.replace(old, new, 1)

          old = '    ...source.roles.flatMap((role) => role.bullets),\n  ].some((claim) => normalized(claim).includes(normalized(skill))\n'
          new = '    ...source.roles.flatMap((role) => role.bullets),\n    source.sourceResumeText,\n  ].some((claim) => normalized(claim).includes(normalized(skill))\n'
          if old not in source:
              raise SystemExit('skill support list not found')
          source = source.replace(old, new, 1)

          old = '  return Boolean(source.education) && claimSupported(Object.values(item).filter(Boolean).join(" "), [source.education]);\n'
          new = '  const educationSources = [source.education, source.sourceResumeText].filter(Boolean);\n  return educationSources.length > 0 && claimSupported(Object.values(item).filter(Boolean).join(" "), educationSources);\n'
          if old not in source:
              raise SystemExit('education support function not found')
          source = source.replace(old, new, 1)

          old = '    source.education,\n  ].filter(Boolean);\n'
          new = '    source.education,\n    source.sourceResumeText,\n  ].filter(Boolean);\n'
          if old not in source:
              raise SystemExit('summary source list not found')
          source = source.replace(old, new, 1)

          quality.write_text(source)

          # 3) Let the numeric guard recognize numbers that are genuinely present
          #    in the authoritative uploaded source, even when structured import missed them.
          base = Path('worker/resume-builder-base.ts')
          source = base.read_text()
          old = '  const correction = correctionRequest ?? "";\n  return {\n'
          new = '  const correction = correctionRequest ?? "";\n  const uploadedSource = typeof root.sourceResumeText === "string" ? root.sourceResumeText : "";\n  return {\n'
          if old not in source:
              raise SystemExit('numeric source insertion point not found')
          source = source.replace(old, new, 1)

          replacements = {
            'sourceText(contact, targetJob, title, correction)': 'sourceText(contact, targetJob, title, uploadedSource, correction)',
            'sourceText(career.yearsExperience, career.summaryNotes, workDetails, fieldValue, correction)': 'sourceText(career.yearsExperience, career.summaryNotes, workDetails, fieldValue, uploadedSource, correction)',
            '      fieldValue,\n      correction,\n    ),': '      fieldValue,\n      uploadedSource,\n      correction,\n    ),',
            '      fieldValue.safety,\n      correction,\n    ),': '      fieldValue.safety,\n      uploadedSource,\n      correction,\n    ),',
            'sourceText(workClaims, workDetails, career.skillsAndTools, fieldValue, correction)': 'sourceText(workClaims, workDetails, career.skillsAndTools, fieldValue, uploadedSource, correction)',
            'sourceText(workDateParts, correction)': 'sourceText(workDateParts, uploadedSource, correction)',
            'sourceText(root.education, correction)': 'sourceText(root.education, uploadedSource, correction)',
            'sourceText(root.additionalDetails, career.safetyTraining, fieldValue, targetJob, correction)': 'sourceText(root.additionalDetails, career.safetyTraining, fieldValue, targetJob, uploadedSource, correction)',
          }
          for old_value, new_value in replacements.items():
              if old_value not in source:
                  raise SystemExit(f'numeric guard pattern missing: {old_value}')
              source = source.replace(old_value, new_value, 1)
          base.write_text(source)

          # 4) Add regression coverage proving raw upload text is preserved and becomes
          #    a usable verification fact source.
          test_path = Path('tests/resume-upload-authoritative-source.test.ts')
          test_path.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { emptyWizardData, toIntake } from "../app/resume-builder/intake/wizard-data";\nimport { mergeResumePrefill } from "../app/resume-builder/intake/resume-upload";\nimport { canonicalSourceRecord, sourceFactCatalog } from "../worker/resume-quality";\n\nconst rawResume = `Kamyren Ellis\nMaintenance Supervisor — RMB\nMarietta, GA\nManaged HVAC service, preventive maintenance, work orders, and vendor coordination.\n\nHVAC Technician — Cooler Heating & Air\nApril 2017 – December 2019\nDiagnosed compressors, motors, contactors, capacitors, transformers, and control boards.\n\nEDUCATION\nHVAC Technical Certificate — Atlanta Technical College\n\nCERTIFICATIONS\nEPA 608 Universal\nOSHA 10`;\n\ntest("uploaded resume text is attached to the actual merged wizard state and persisted intake", () => {\n  const merged = mergeResumePrefill(emptyWizardData(), {\n    trade: "Facilities Maintenance",\n    contact: { fullName: "Kamyren Ellis", cityState: "Marietta, GA" },\n    roles: [{ employer: "RMB", jobTitle: "Maintenance Supervisor", responsibilities: "Managed HVAC service and work orders." }],\n    fieldValue: { certifications: ["EPA 608 Universal"] },\n  }, rawResume);\n\n  assert.equal(merged.sourceResumeText, rawResume);\n  const intake = toIntake(merged, "candidate@example.com") as Record<string, unknown>;\n  assert.equal(intake.sourceResumeText, rawResume);\n});\n\ntest("authoritative raw upload becomes part of canonical verification and grounding facts", () => {\n  const source = canonicalSourceRecord({\n    sourceResumeText: rawResume,\n    meta: { source: "upload", importedResume: true },\n    contact: { fullName: "Kamyren Ellis" },\n    experience: [{ employer: "RMB", jobTitle: "Maintenance Supervisor", responsibilities: "Managed HVAC service and work orders." }],\n    fieldValue: { certifications: ["EPA 608 Universal"] },\n    education: "",\n  }, "Maintenance Supervisor");\n\n  assert.equal(source.sourceResumeText, rawResume);\n  const facts = sourceFactCatalog(source);\n  assert.ok(facts.some((fact) => fact.id.startsWith("upload.raw.") && fact.value.includes("HVAC Technical Certificate")));\n  assert.ok(facts.some((fact) => fact.id.startsWith("upload.raw.") && fact.value.includes("Cooler Heating & Air")));\n});\n''')
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "TRADE HUSTL3 Automation"
          git config user.email "tradehustl3@gmail.com"
          git add app/resume-builder/intake/wizard.tsx worker/resume-quality.ts worker/resume-builder-base.ts tests/resume-upload-authoritative-source.test.ts
          git rm .github/workflows/patch-upload-authoritative-source.yml
          git commit -m "Make uploaded resume text authoritative through generation"
          git push origin HEAD:fix/upload-authoritative-source
