version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Hold every pdfjs-dist update out of grouped bumps. It parses
      # customer-uploaded resumes, so it moves only in its own reviewed change.
      # - 5.6.83 to <6.2.108 is affected by GHSA-hq66-cqwq-w95j (arbitrary
      #   JavaScript execution when opening a malicious PDF). main pins 5.4.149,
      #   below that range; a grouped bump to 5.7.x would introduce it.
      # - 6.x is breaking (PDFDocumentProxy.destroy removed). The fix is a
      #   dedicated migration to >=6.2.108 with upload and preview tests.
      - dependency-name: "pdfjs-dist"
    groups:
      production-security:
        dependency-type: production
      development-security:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
