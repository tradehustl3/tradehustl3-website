<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Skilled trades at work</title>
  <desc id="desc">A painter sprays a green dollar sign, a concrete mixer drives along a road, and a traffic flagger holds a stop sign.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0.6" y2="1"><stop stop-color="#29465b"/><stop offset="1" stop-color="#0b2539"/></linearGradient>
    <linearGradient id="road" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#426177" stop-opacity=".5"/><stop offset="1" stop-color="#133347" stop-opacity=".82"/></linearGradient>
    <filter id="sprayGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <!-- One continuous construction roadway ties the three trades together. -->
  <path d="M0 250Q200 243 360 251T700 251T960 248V300H0Z" fill="url(#road)"/>
  <path d="M0 250Q220 244 480 250T960 249" fill="none" stroke="#315c77" stroke-width="4"/>
  <path d="M62 277h93m54 0h93m54 0h93m54 0h93m54 0h93m54 0h93m54 0h48" stroke="#e7c665" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <!-- Painter, with hose, respirator and recognizable hand-held spray gun. -->
  <g fill="#17374c" stroke="#4b91b7" stroke-width="3" stroke-linejoin="round">
    <path d="M81 240l7-67 20-32 39-4 23 26 5 79-34 2-3-53-8 2-8 51Z"/>
    <path d="M104 246l-2 34h26l7-40m8 2 7 38h27l-6-42" fill="#102b3e"/>
    <path d="M110 143q-8-27 4-44 16-18 37-5 12 12 3 34l-15 17Z"/>
    <path d="M109 103q12-30 33-26 23 3 29 28l-18-2-31-5Z" fill="#12344a"/>
    <path d="M148 117l14 6-10 12-12-5Z" fill="#082534"/>
    <path d="M146 146l31 3 35-31 13 10-36 47-24 13Z"/>
    <path d="M220 120l13-9 19 12-10 11-19-4Z" fill="#102b3e"/>
    <path d="M245 111h27v8h-26zm-5 8 13 1-3 10-10-2Z" fill="#21475d"/>
    <path d="M100 166l-19 33-4 47" fill="none" stroke-width="10"/>
    <path d="M242 126q-32 42-4 90t-24 60" fill="none" stroke="#376783" stroke-width="4"/>
  </g>
  <!-- Sprayed money motif emanates from the gun nozzle, not a floating typographic layer. -->
  <g fill="#a9ed39">
    <circle cx="282" cy="117" r="3"/><circle cx="296" cy="109" r="4"/><circle cx="305" cy="131" r="2.5"/>
    <circle cx="317" cy="98" r="3"/><circle cx="328" cy="122" r="4"/><circle cx="343" cy="108" r="2"/>
    <circle cx="358" cy="128" r="2.5"/><circle cx="345" cy="143" r="3"/><circle cx="380" cy="105" r="2"/>
  </g>
  <text x="351" y="115" font-family="Impact,Arial Black,sans-serif" font-size="84" font-weight="900" transform="rotate(-11 351 115)" fill="#a9ed39" opacity=".28" filter="url(#sprayGlow)">$</text>
  <text x="351" y="115" font-family="Impact,Arial Black,sans-serif" font-size="84" font-weight="900" transform="rotate(-11 351 115)" fill="#9edc32">$</text>
  <!-- Construction mixer truck: distinct drum, chassis, six wheels and cab. -->
  <g stroke="#376b89" stroke-width="3" stroke-linejoin="round">
    <path d="M452 202h297v35H445v-22Z" fill="#102b3e"/>
    <path d="M465 194l22-68 115-11 61 68-20 22-159 3Z" fill="url(#steel)"/>
    <ellipse cx="555" cy="158" rx="78" ry="43" transform="rotate(13 555 158)" fill="#1e455b"/>
    <path d="M494 128q58 67 106 73m-83-79q61 66 102 74m-3-76 44-14 32 20-19 53-22 13" fill="none" stroke="#6199b1" stroke-width="6"/>
    <path d="M658 171l30-56 50 9 21 48v48h-107Z" fill="#173d54"/>
    <path d="M695 124l35 7 16 38h-58Z" fill="#9cc4d5" opacity=".85"/>
    <path d="M738 180h21v20h-21Z" fill="#e2ba68"/>
    <path d="M666 192h47" stroke="#4c86a6" stroke-width="4"/>
    <circle cx="492" cy="237" r="27" fill="#102637"/><circle cx="492" cy="237" r="12" fill="#6b9eb7"/>
    <circle cx="557" cy="237" r="27" fill="#102637"/><circle cx="557" cy="237" r="12" fill="#6b9eb7"/>
    <circle cx="709" cy="237" r="27" fill="#102637"/><circle cx="709" cy="237" r="12" fill="#6b9eb7"/>
  </g>
  <!-- Road crew flagger holding a readable STOP paddle. -->
  <g stroke="#376b89" stroke-width="3" stroke-linejoin="round">
    <path d="M837 150l-20 21-15 58 17 4 24-46 6 57h23l5-60 9 60h24l-13-81-26-24Z" fill="#14364b"/>
    <circle cx="859" cy="116" r="20" fill="#15394f"/>
    <path d="M838 108q8-26 28-22 20 5 19 24Z" fill="#173c50"/>
    <path d="M818 167l-16-15-12-42" fill="none" stroke-width="13" stroke-linecap="round"/>
    <path d="M859 165l22 9 20-25" fill="none" stroke-width="12" stroke-linecap="round"/>
    <path d="M866 163l9 31m-30-30 7 31" stroke="#c5d9e1" stroke-width="5" opacity=".65"/>
    <path d="M786 108V63" stroke="#214f66" stroke-width="6"/>
    <path d="M769 42h34l13 13v30l-13 13h-34l-13-13V55Z" fill="#a6333b" stroke="#e38c88" stroke-width="3"/>
  </g>
  <text x="786" y="76" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="900" text-anchor="middle">STOP</text>
</svg>
